  .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-bottom:7px}

  .savebar button{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:2px;border:1.5px solid #fff;background:#fff;color:var(--clay);cursor:pointer;margin-left:8px}
  .savebar button.ghost{background:transparent;color:#fff}
  .tabs{display:flex;overflow-x:auto;border:1px solid var(--rule);border-radius:2px;background:var(--washi2);margin:16px 0}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;padding:10px 14px;border:0;border-right:1px solid var(--rule);background:none;cursor:pointer;font:inherit;text-align:left}
  .tab:last-child{border-right:0}
  .tab .t1{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}
  .tab .t2{font-size:10px;color:var(--grey);white-space:nowrap;margin-top:2px}
  .tab[aria-selected=true]{background:var(--indigo)}
  .tab[aria-selected=true] .t1{color:#fff}
  .tab[aria-selected=true] .t2{color:rgba(255,255,255,.7)}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
  @media(max-width:840px){.grid{grid-template-columns:1fr}}
  .mapcard{border:1px solid var(--rule);border-radius:2px;background:var(--washi2);overflow:hidden;position:sticky;top:52px;z-index:1}

  .mk{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--indigo);border:2px solid var(--washi);box-shadow:0 1px 4px rgba(0,0,0,.3);color:#fff;font:700 10px var(--mono)}
  .mk.on{background:var(--clay)}
  .mk-h{border-radius:3px;background:var(--plum)}
  .mk-poi{transform:rotate(45deg);border-radius:2px;background:var(--moss)}
  .mk-poi span{transform:rotate(-45deg);font-size:9px}
  .mk-poi.on{background:var(--clay)}
  .mk-air{border-radius:3px;background:var(--indigo2)}

  .meal{display:flex;gap:10px;padding:9px 12px;border-bottom:1px dotted var(--rule);cursor:pointer}

  .num{flex:0 0 18px;height:18px;border-radius:50%;background:var(--indigo);color:#fff;font:700 9px var(--mono);display:flex;align-items:center;justify-content:center;margin-top:2px}
  .meal.on .num{background:var(--clay)}
  .m1{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}

  .m4{font-family:var(--mono);font-size:9.5px;color:var(--grey);margin-top:4px}
  .note{font-size:11px;line-height:1.45;margin-top:6px;padding:6px 8px;background:rgba(34,64,107,.07);border-left:2px solid var(--indigo);color:#2C4A73}

  .tag{display:inline-block;font:600 8px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:1.5px 5px;border-radius:2px;margin-left:5px;vertical-align:1px;color:#fff}

  .hotel-card dt{font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-top:7px}

  .hotel-card dd{margin-top:1px}
  .hotel-card a{color:var(--indigo)}

  .map-legend .l-box { width: 9px; height: 9px; display: inline-block; border-radius: 1px; }
  .map-legend .l-circ { width: 9px; height: 9px; display: inline-block; border-radius: 50%; }
  .map-legend .l-dia { width: 7px; height: 7px; display: inline-block; transform: rotate(45deg); }
  /* Footer & Watermark Styles */

  .f-text { font-family:var(--mono); font-size:10px; color:var(--grey); line-height:1.8; margin-bottom: 12px;}
  .f-bottom { display: flex; justify-content: flex-end; align-items: center; border-top: 1px dotted var(--rule); padding-top: 12px; padding-bottom: 12px;}
  .f-logos { display: flex; gap: 12px; align-items: center; color: var(--grey); }
  .f-logos svg { height: 18px; width: auto; fill: currentColor; }

async function sGet(){
  // 1. Try to fetch from Edge Config Cloud
  try {
    const res = await fetch('/api/sync');
    if (res.ok) {
      const data = await res.json();
      return data.value ? JSON.stringify(data.value) : null;
    }
  } catch(e) { console.error('Cloud load failed, falling back to local'); }
  
  // 2. Fallback to local storage if offline
  try{return localStorage.getItem(KEY);}catch(e){}
  return mem;
}

async function sSet(v){
  // 1. Try to save to Edge Config Cloud
  try {
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: v
    });
    if (res.ok) return 'cloud';
  } catch(e) { console.error('Cloud save failed, falling back to local'); }
  
  // 2. Fallback to local storage if offline
  try{localStorage.setItem(KEY,v);return'browser';}catch(e){}
  mem=v;return'memory';
}

  try {

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

    });
  } catch(e){}
  try{localStorage.removeItem(KEY);}catch(e){}
  mem=null;
}

let ci=0,sel=null,selPoi=null,editMode=false,showPoi=true,cat='all',map=null,markers={};
const RES_LABEL={ok:'Booked',book:'To book',walk:'Walk-in'};

CITIES.forEach((c,i)=>{const b=document.createElement('button');b.className='tab';b.setAttribute('aria-selected',i===0);

function icon(html,size,cls){return L.divIcon({className:'',html:`<div class="mk ${cls||''}" style="width:${size}px;height:${size}px">${html}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});}

function buildMap(c){
  if(map){map.remove();map=null;}
  markers={};
  map=L.map('map',{scrollWheelZoom:true});
  // GPS Locator
  map.locate({setView: false, maxZoom: 16});
  map.on('locationfound', function(e) {
    L.circleMarker(e.latlng, {
      radius: 6, color: '#fff', weight: 2, fillColor: '#22406B', fillOpacity: 1
    }).addTo(map).bindPopup("You are here");
  });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'&copy; Esri'}).addTo(map);
  const hotel=HOTELS[c.hotel];
  const bounds=[[hotel.lat,hotel.lng]];

  // day loops: hotel → meals(in day order) → hotel
  const byDay={};c.stops.forEach(st=>{(byDay[st.d]=byDay[st.d]||[]).push(st);});
  Object.values(byDay).forEach(ms=>{
    const pts=[[hotel.lat,hotel.lng],...ms.map(s=>[s.lat,s.lng]),[hotel.lat,hotel.lng]];
    const far=ms.some(s=>Math.hypot(s.lat-hotel.lat,(s.lng-hotel.lng)*0.82)*111>15);
    L.polyline(pts,{color:far?'#22406B':'#8E4B62',weight:far?2:1.6,dashArray:far?'8 5':'2 5',opacity:.55}).addTo(map);
  });

  // NRT arrival route on Yokohama
  if(c.showNRT){
    L.polyline([[NRT.lat,NRT.lng],[hotel.lat,hotel.lng]],{color:'#4A6E9E',weight:2,dashArray:'10 6',opacity:.6}).addTo(map);
    const am=L.marker([NRT.lat,NRT.lng],{icon:icon('✈',24,'mk-air')}).addTo(map);
    am.bindPopup(`<b>${NRT.n}</b><br>ZG021 lands 12:45 · N'EX direct to Yokohama ~90 min`);
    bounds.push([NRT.lat,NRT.lng]);
  }

  // meals
  c.stops.forEach(s=>{
    const e=eff(s);
    const m=L.marker([s.lat,s.lng],{icon:icon(s.id,sel===s.id?28:22,sel===s.id?'on':'')}).addTo(map);

    // Dynamically appends booking time and platform if they exist
    let popupContent = `<b>${s.name}</b><br>${s.d} · ${s.m} — ${s.dish}<br>${s.hrs}<br>${RES_LABEL[e.res]}`;
    if (e.res === 'ok' && (e.btime || e.bplat)) {
      popupContent += ` (${e.btime || ''}${e.btime && e.bplat ? ' via ' : ''}${e.bplat || ''})`;
    }
    popupContent += ` · ¥${Number(e.jpy).toLocaleString()}`;

    m.bindPopup(popupContent);
    m.on('click',()=>{sel=s.id;selPoi=null;renderSide(c);refreshIcons(c);});
    markers['m'+s.id]=m;
    bounds.push([s.lat,s.lng]);
  });

  // POIs
  if(showPoi)c.pois.forEach((p,i)=>{
    if(cat!=='all'&&p.c!==cat)return;
    const m=L.marker([p.lat,p.lng],{icon:icon(`<span>${p.ic}</span>`,selPoi===i?26:20,'mk-poi'+(selPoi===i?' on':''))}).addTo(map);
    const gMapUrl = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
    m.bindPopup(`<b>${p.n}</b><br>${p.d}<br><i>near ${p.a}</i>
      <div style="margin-top:8px; border-top:1px dotted var(--rule); padding-top:6px;">
        <a href="${gMapUrl}" target="_blank" style="font-family:var(--mono); font-size:10px; color:var(--indigo); text-decoration:none; font-weight:600; text-transform:uppercase; letter-spacing:0.02em;">
          📍 Open in Google Maps ↗
        </a>
      </div>
    `);
    m.on('click',()=>{selPoi=i;sel=null;renderSide(c);refreshIcons(c);});
    markers['p'+i]=m;
    bounds.push([p.lat,p.lng]);
  });

  // hotel
  const hm=L.marker([hotel.lat,hotel.lng],{icon:icon('H',24,'mk-h')}).addTo(map);
  hm.bindPopup(`<b>${hotel.n}</b><br>${hotel.stn}`);
  map.fitBounds(bounds,{padding:[36,36]});

  // Visual Map Legend - NOW OUTSIDE THE LOOP
  const legend = L.control({position: 'bottomright'});
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'map-legend');
    div.innerHTML = `
      <div style="font-weight:bold; margin-bottom:6px; color:var(--indigo);">Legend</div>
      <div class="l-row"><span class="l-box" style="background:var(--plum);"></span> Hotel</div>
      <div class="l-row"><span class="l-circ" style="background:var(--indigo);"></span> Meals</div>
      <div class="l-row"><span class="l-dia" style="background:var(--moss);"></span> POI</div>
      <div class="l-row"><span style="color:var(--plum); font-weight:bold; font-size:12px; line-height:8px; margin-top:-4px;">⋯</span> Day loop</div>
      <div class="l-row"><span style="color:var(--indigo); font-weight:bold; font-size:12px; line-height:8px; margin-top:-4px;">╌</span> Transit</div>
    `;
    return div;
  };
  legend.addTo(map);
}
function refreshIcons(c){
  c.stops.forEach(s=>{const m=markers['m'+s.id];if(m)m.setIcon(icon(s.id,sel===s.id?28:22,sel===s.id?'on':''));});
  c.pois.forEach((p,i)=>{const m=markers['p'+i];if(m)m.setIcon(icon(`<span>${p.ic}</span>`,selPoi===i?26:20,'mk-poi'+(selPoi===i?' on':'')));});
}

function mealCard(p){
  const e=eff(p);
  return `<div class="meal ${sel===p.id?'on':''}" data-n="${p.id}">
    <div class="num">${p.id}</div>
    <div style="flex:1;min-width:0">
      <div class="m1">${p.d} · ${p.m}</div>
      <div class="m2">${p.name}<span class="tag ${e.res}">${RES_LABEL[e.res]}</span></div>

      ${!editMode && e.res==='ok' && (e.btime || e.bplat) ? `<div style="display:inline-block; margin-top:4px; margin-bottom:2px; padding:3px 6px; background:rgba(94,127,76,.1); color:var(--moss); font:600 10px var(--mono); text-transform:uppercase; letter-spacing:0.05em; border-radius:2px;">✓ Reserved ${e.btime ? 'at ' + e.btime : ''} ${e.bplat ? 'via ' + e.bplat : ''}</div>` : ''}

      <div class="m3">${p.dish}</div>
      <div class="m4">${p.hrs} · ¥${Number(e.jpy).toLocaleString()}</div>
      <div class="efields">

          <select data-f="res" data-id="${p.id}">${Object.entries(RES_LABEL).map(([v,l])=>`<option value="${v}" ${e.res===v?'selected':''}>${l}</option>`).join('')}</select>
        </div>

        <div class="erow" style="margin-top:4px;">
          <label>Time <input type="text" placeholder="e.g., 18:30" data-f="btime" data-id="${p.id}" value="${e.btime||''}"></label>
          <label>Platform <input type="text" placeholder="e.g., Tablecheck" data-f="bplat" data-id="${p.id}" value="${e.bplat||''}"></label>
        </div>

        <textarea rows="2" data-f="unote" data-id="${p.id}" placeholder="Your note…">${e.unote||''}</textarea>

      ${e.warn?`<div class="note warn">${e.warn}</div>`:''}
      ${e.note?`<div class="note">${e.note}</div>`:''}
      ${e.unote&&!editMode?`<div class="note" style="border-left-color:var(--moss);background:rgba(94,127,76,.08);color:#465F38">✎ ${e.unote}</div>`:''}
    </div></div>`;
}

  const hotel=HOTELS[c.hotel];
  const total=c.stops.reduce((a,s)=>a+Number(eff(s).jpy),0);
  const visPois=c.pois.map((p,i)=>({...p,i})).filter(p=>cat==='all'||p.c===cat);
  document.getElementById('side').innerHTML=`
    <div class="card"><div class="chead"><span>Meals</span><span>¥${total.toLocaleString()}</span></div>${c.stops.map(mealCard).join('')}</div>
    <div class="card"><div class="chead"><span>Getting there & away</span></div>
      ${c.legs.map(l=>`<div class="leg"><div class="lr">${l.r}</div><div class="lm">${l.m}</div><div class="note">${l.n}</div></div>`).join('')}</div>
    <div class="card hotel-card"><div class="chead"><span>Hotel</span></div><dl>
      <dt>Name</dt><dd><b>${hotel.n}</b></dd>
      <dt>Address</dt><dd>${hotel.addr}</dd>
      <dt>Nearest station</dt><dd>${hotel.stn}</dd>
      <dt>Phone</dt><dd><a href="tel:${hotel.tel.replace(/[^+\d]/g,'')}">${hotel.tel}</a></dd>
      <dt>Email</dt><dd>${hotel.mail.includes('@')?`<a href="mailto:${hotel.mail}">${hotel.mail}</a>`:hotel.mail}</dd>
      <dt>Note</dt><dd>${hotel.note}</dd></dl></div>
    <div class="card"><div class="chead"><span>Getting around</span></div>
      <div class="metro">${c.metro.map(m=>`<div class="row"><b>${m[0]}</b><br>${m[1]}</div>`).join('')}</div></div>
    <div class="card"><div class="chead"><span>While you're there</span><span>◆ on map</span></div>
      <div class="chips">
        <button class="chip ${cat==='all'?'on':''}" data-cat="all">All</button>
        ${Object.entries(CAT).map(([k,l])=>`<button class="chip ${cat===k?'on':''}" data-cat="${k}">${l}</button>`).join('')}
      </div>
      <div class="poi-list">${visPois.map(p=>`<div class="prow ${selPoi===p.i?'on':''}" data-poi="${p.i}">
        <span class="icon">${p.ic}</span><span><b>${p.n}</b> — ${p.d} <span class="anchor">· near ${p.a}</span></span></div>`).join('')||'<div style="padding:8px 0;font-size:12px;color:var(--grey)">Nothing in this category here.</div>'}</div></div>`;

  document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{cat=ch.dataset.cat;selPoi=null;render();});
  document.querySelectorAll('.prow').forEach(el=>el.onclick=()=>{
    selPoi=+el.dataset.poi;sel=null;

    const mk=markers['p'+selPoi];if(mk){map.panTo(mk.getLatLng());mk.openPopup();}});

    if(e.target.matches('input,select,textarea,option'))return;

  document.querySelectorAll('[data-f]').forEach(inp=>{inp.onchange=()=>{
    const id=inp.dataset.id;overrides[id]=overrides[id]||{};

}

function renderExpenses() {
  const exps = overrides.expenses || [];
  const total = exps.reduce((sum, e) => sum + Number(e.usd), 0);
  
  const cats = ["Food", "POI & Cafe", "Shinkansen", "Hotel", "Flight", "Omiyage"];
  const cards = ["AMEX Platinum", "AMEX Gold", "AMEX Bonvoy Brilliant", "United Quest"];

  // Calculate summaries
  const catTotals = {};
  cats.forEach(c => catTotals[c] = 0);
  const cardTotals = {};
  cards.forEach(c => cardTotals[c] = { paid: 0, unpaid: 0, total: 0 });

  exps.forEach(e => {
    const amt = Number(e.usd);
    if(catTotals[e.cat] !== undefined) catTotals[e.cat] += amt;
    if(cardTotals[e.card] !== undefined) {
      cardTotals[e.card].total += amt;
      if(e.paid) cardTotals[e.card].paid += amt;
      else cardTotals[e.card].unpaid += amt;
    }
  });

  panel.innerHTML = `<div class="card" style="max-width:850px; margin: 0 auto;">
    <div class="chead"><span>Expense Tracker</span><span>Total: $${total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></div>
    
    <div style="display:flex; gap:24px; padding:16px; border-bottom:1px solid var(--rule); background:var(--washi2); flex-wrap:wrap;">
      <div style="flex:1; min-width:200px;">
        <div style="font:600 10px var(--mono); color:var(--indigo); text-transform:uppercase; margin-bottom:8px;">By Category</div>
        ${cats.filter(c => catTotals[c] > 0).map(c => `
          <div style="display:flex; justify-content:space-between; font-size:12px; border-bottom:1px dotted var(--rule); padding:5px 0;">
            <span>${c}</span> <b>$${catTotals[c].toLocaleString('en-US', {minimumFractionDigits: 2})}</b>
          </div>`).join('') || '<div style="font-size:11px; color:var(--grey);">No data yet.</div>'}
      </div>
      <div style="flex:1.5; min-width:250px;">
        <div style="font:600 10px var(--mono); color:var(--indigo); text-transform:uppercase; margin-bottom:8px;">By Card</div>
        ${cards.filter(c => cardTotals[c].total > 0).map(c => `
          <div style="display:flex; justify-content:space-between; font-size:12px; border-bottom:1px dotted var(--rule); padding:5px 0; align-items:flex-start;">
            <span>${c}</span> 
            <span style="text-align:right;">
              <b>$${cardTotals[c].total.toLocaleString('en-US', {minimumFractionDigits: 2})}</b><br>
              <span style="font-size:9.5px; font-family:var(--mono); color:var(--moss);">${cardTotals[c].paid > 0 ? 'PAID: $' + cardTotals[c].paid.toLocaleString('en-US', {minimumFractionDigits: 2}) : ''}</span>
              ${cardTotals[c].paid > 0 && cardTotals[c].unpaid > 0 ? ' <span style="color:var(--grey)">|</span> ' : ''}
              <span style="font-size:9.5px; font-family:var(--mono); color:var(--clay);">${cardTotals[c].unpaid > 0 ? 'UNPAID: $' + cardTotals[c].unpaid.toLocaleString('en-US', {minimumFractionDigits: 2}) : ''}</span>
            </span>
          </div>`).join('') || '<div style="font-size:11px; color:var(--grey);">No data yet.</div>'}
      </div>
    </div>

    <div style="padding:16px;">
      <form id="expForm" data-edit-idx="" style="display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px; align-items:flex-end; background:rgba(34,64,107,.04); padding:12px; border:1px solid var(--rule); border-radius:2px;">
        
        <label style="flex:1; min-width:110px; font:600 10px var(--mono); color:var(--indigo); text-transform:uppercase;">Date<br>
          <input type="date" id="exDate" required style="width:100%; font:inherit; font-size:12px; border:1px solid var(--rule); border-radius:2px; padding:6px; margin-top:4px; background:#fff;">
        </label>

        <div style="flex:1.5; min-width:160px; display:flex; gap:6px;">
          <label style="flex:1; font:600 10px var(--mono); color:var(--indigo); text-transform:uppercase;">¥ JPY<br>
            <input type="number" id="exJpy" style="width:100%; font:inherit; font-size:12px; border:1px solid var(--rule); border-radius:2px; padding:6px; margin-top:4px; background:#fff;" placeholder="0">
          </label>
          <label style="flex:1; font:600 10px var(--mono); color:var(--indigo); text-transform:uppercase;">$ USD<br>
            <input type="number" step="0.01" id="exUsd" required style="width:100%; font:inherit; font-size:12px; border:1px solid var(--rule); border-radius:2px; padding:6px; margin-top:4px; background:#fff;" placeholder="0.00">
          </label>
        </div>
        
        <label style="flex:1; min-width:110px; font:600 10px var(--mono); color:var(--indigo); text-transform:uppercase;">Category<br>
          <select id="exCat" style="width:100%; font:inherit; font-size:12px; border:1px solid var(--rule); border-radius:2px; padding:6px; margin-top:4px; background:#fff;">
            ${cats.map(c=>`<option>${c}</option>`).join('')}
          </select>
        </label>
        
        <label style="flex:1.5; min-width:130px; font:600 10px var(--mono); color:var(--indigo); text-transform:uppercase;">Card Used<br>
          <select id="exCard" style="width:100%; font:inherit; font-size:12px; border:1px solid var(--rule); border-radius:2px; padding:6px; margin-top:4px; background:#fff;">
            ${cards.map(c=>`<option>${c}</option>`).join('')}
          </select>
        </label>
        
        <label style="flex:2; min-width:150px; font:600 10px var(--mono); color:var(--indigo); text-transform:uppercase;">Description<br>
          <input type="text" id="exDesc" required style="width:100%; font:inherit; font-size:12px; border:1px solid var(--rule); border-radius:2px; padding:6px; margin-top:4px; background:#fff;" placeholder="e.g., Cat collars for Simba & Ahri">
        </label>
        
        <button id="expSubmitBtn" type="submit" style="font:600 11px var(--mono); text-transform:uppercase; letter-spacing:0.08em; background:var(--clay); color:#fff; border:none; padding:7px 14px; border-radius:2px; cursor:pointer; height:30px; transition: background 0.2s;">+ Add</button>
      </form>

      <div>
        ${exps.length === 0 ? '<div class="note">No expenses logged yet.</div>' : ''}
        ${exps.slice().reverse().map((e, revIdx) => {
          const i = exps.length - 1 - revIdx; // Real array index
          return `
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dotted var(--rule); padding:10px 0; ${e.paid ? 'opacity:0.6;' : ''}">
            <div style="display:flex; align-items:center; gap:12px;">
              <input type="checkbox" ${e.paid ? 'checked' : ''} onchange="togglePaid(${i}, this.checked)" title="Mark as Paid" style="width:16px; height:16px; accent-color:var(--moss); cursor:pointer;">
              <div>
                <div style="font-family:var(--serif); font-size:15px; font-weight:700; color:var(--ink); ${e.paid ? 'text-decoration:line-through;' : ''}">${e.desc}</div>
                <div style="font-family:var(--mono); font-size:9.5px; color:var(--grey); margin-top:2px; text-transform:uppercase;">${e.date} · ${e.cat} · ${e.card}</div>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:16px;">
              <div style="font-family:var(--mono); font-weight:700; color:var(--indigo); font-size:14px;">$${Number(e.usd).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
              <div style="display:flex; gap:6px;">
                <button onclick="editExp(${i})" title="Edit" style="background:none; border:none; color:var(--indigo); cursor:pointer; font-size:14px; padding:0 4px;">✎</button>
                <button onclick="deleteExp(${i})" title="Delete" style="background:none; border:none; color:var(--clay); cursor:pointer; font-size:18px; line-height:1; padding:0 4px;">×</button>
              </div>
            </div>
          </div>
        `}).join('')}
      </div>
    </div>
  </div>`;

  // Pre-fill date
  document.getElementById('exDate').value = new Date().toISOString().split('T')[0];

  // Auto-calculate JPY to USD (Using 150 exchange rate - you can adjust this!)
  document.getElementById('exJpy').addEventListener('input', (e) => {
    if(e.target.value) {
      document.getElementById('exUsd').value = (Number(e.target.value) / 150).toFixed(2);
    } else {
      document.getElementById('exUsd').value = '';
    }
  });

  // Handle Add/Update submission
  document.getElementById('expForm').onsubmit = (ev) => {
    ev.preventDefault();
    overrides.expenses = overrides.expenses || [];
    const form = document.getElementById('expForm');
    const idx = form.dataset.editIdx;

    const newExp = {
      date: document.getElementById('exDate').value,
      usd: document.getElementById('exUsd').value,
      cat: document.getElementById('exCat').value,
      card: document.getElementById('exCard').value,
      desc: document.getElementById('exDesc').value,
      paid: false
    };

    if (idx !== "") { // We are UPDATING an existing expense
      newExp.paid = overrides.expenses[idx].paid; // Keep checkmark status
      overrides.expenses[idx] = newExp;
      form.dataset.editIdx = ""; // Reset edit mode
    } else { // We are ADDING a new expense
      overrides.expenses.push(newExp);
    }

    saveOverrides();
    renderExpenses();
  };
}

// Global Handlers
window.deleteExp = function(idx) {
  if(!confirm("Delete this expense?")) return;
  overrides.expenses.splice(idx, 1);
  saveOverrides();
  renderExpenses();
};

window.togglePaid = function(idx, isChecked) {
  overrides.expenses[idx].paid = isChecked;
  saveOverrides();
  renderExpenses();
};

window.editExp = function(idx) {
  const e = overrides.expenses[idx];
  document.getElementById('exDate').value = e.date;
  document.getElementById('exUsd').value = e.usd;
  document.getElementById('exJpy').value = ''; // clear JPY since we saved in USD
  document.getElementById('exCat').value = e.cat;
  document.getElementById('exCard').value = e.card;
  document.getElementById('exDesc').value = e.desc;

  // Change UI to "Update" mode
  const form = document.getElementById('expForm');
  const btn = document.getElementById('expSubmitBtn');
  form.dataset.editIdx = idx;
  btn.textContent = "✓ Update";
  btn.style.background = "var(--moss)";
  
  // Smooth scroll back up to the form
  form.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

function renderCalc() {
  panel.innerHTML = `
  <div class="card" style="max-width:500px; margin: 40px auto; padding:32px 24px; text-align:center;">
    <div style="font-family:var(--serif); font-size:24px; color:var(--indigo); margin-bottom:8px;">Quick Converter</div>
    <div style="font-family:var(--mono); font-size:11px; color:var(--moss); margin-bottom:32px; letter-spacing:0.05em; text-transform:uppercase;">
      Live Rate: ¥${liveJpyRate.toFixed(2)} = $1.00
    </div>
    
    <div style="margin-bottom:24px; position:relative;">
      <div style="font:600 12px var(--mono); color:var(--grey); text-transform:uppercase; margin-bottom:8px; text-align:left;">Price in Yen (¥)</div>
      <input type="number" id="quickJpy" placeholder="0" style="width:100%; font-family:var(--serif); font-size:48px; font-weight:700; color:var(--ink); border:none; border-bottom:2px solid var(--clay); background:transparent; padding:8px 0; text-align:center; outline:none;">
    </div>

    <div style="margin-bottom:24px;">
      <div style="font:600 12px var(--mono); color:var(--grey); text-transform:uppercase; margin-bottom:8px; text-align:left;">Cost in USD ($)</div>
      <div id="quickUsd" style="font-family:var(--serif); font-size:48px; font-weight:700; color:var(--moss); padding:8px 0;">$0.00</div>
    </div>
  </div>`;

  // Instant math as you type
  document.getElementById('quickJpy').addEventListener('input', (e) => {
    const jpy = Number(e.target.value);
    const usdDisplay = document.getElementById('quickUsd');
    if (jpy > 0) {
      usdDisplay.textContent = '$' + (jpy / liveJpyRate).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    } else {
      usdDisplay.textContent = '$0.00';
    }
  });
}

function render(){
  [...tabs.children].forEach((b,i)=>b.setAttribute('aria-selected',i===ci));
  const c=CITIES[ci];

  if(c.calc){
    if(map){map.remove();map=null;}
    renderCalc();
    return;
  }
  
  if(c.expenses){
    if(map){map.remove();map=null;}
    renderExpenses();
    return;
  }

  if(c.flights||c.rail_only){
    if(map){map.remove();map=null;}
    const rows=c.flights?FLIGHTS:TRAINS;
    panel.innerHTML=`<div class="card"><div class="chead"><span>${c.flights?'Flights':'Shinkansen & intercity'}</span></div>
      ${rows.map(t=>`<div class="train"><div class="route">${t.route}</div>
        <div class="tmeta">${t.d} · ${t.t} · ${t.train}</div>
        <div class="note ${t.warn?'warn':''}">${t.note}</div></div>`).join('')}</div>`;
    return;
  }
  panel.innerHTML=`<div class="grid">
    <div class="mapcard"><div class="maphead"><h2>${c.city}</h2>
      <button class="poitoggle ${showPoi?'on':''}" id="poiT" type="button">◆ POI ${showPoi?'on':'off'}</button></div>
      <div id="map"></div></div>
    <div class="stack" id="side"></div></div>`;
  document.getElementById('poiT').onclick=()=>{showPoi=!showPoi;selPoi=null;render();};
  buildMap(c);
  renderSide(c);
}
loadOverrides().then(render);
  
/* ---------------- LIVE EXCHANGE RATE ---------------- */
let liveJpyRate = 150.00; // Fallback offline rate

async function fetchExchangeRate() {
  try {
    const res = await fetch('https://latest.currency-api.pages.dev/v1/currencies/usd.json');
    if (res.ok) {
      const data = await res.json();
      if (data && data.usd && data.usd.jpy) {
        liveJpyRate = data.usd.jpy;
        // If the user is already looking at the Calc or Expense tab, refresh it to show the live rate
        if (CITIES[ci].calc || CITIES[ci].expenses) render();
      }
    }
  } catch(e) { console.error('Could not fetch live rate, using offline fallback.'); }
}

// Kick off the fetch immediately
fetchExchangeRate();
</script>
</body>
